[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  PRISMA_CLI_BINARY_TARGETS = "rhel-openssl-3.0.x"

# Required so Netlify provisions SSR functions (without this, site serves empty 404)
[[plugins]]
  package = "@netlify/plugin-nextjs"

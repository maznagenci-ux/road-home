# Road Home — Hostinger VPS (sole production host)
# Install: /etc/nginx/sites-available/road-home
# Primary: https://zmkh-roadhome.com

# HTTP → HTTPS apex
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zmkh-roadhome.com www.zmkh-roadhome.com zmkh-roadhome.io www.zmkh-roadhome.io 72.60.80.208;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://zmkh-roadhome.com$request_uri;
    }
}

# www → apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.zmkh-roadhome.com;

    ssl_certificate     /etc/letsencrypt/live/zmkh-roadhome.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zmkh-roadhome.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zmkh-roadhome.com$request_uri;
}

# Legacy .io → apex (HTTPS, own cert)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zmkh-roadhome.io www.zmkh-roadhome.io;

    ssl_certificate     /etc/letsencrypt/live/zmkh-roadhome.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zmkh-roadhome.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zmkh-roadhome.com$request_uri;
}

# Primary app — zmkh-roadhome.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zmkh-roadhome.com;

    client_max_body_size 25m;

    ssl_certificate     /etc/letsencrypt/live/zmkh-roadhome.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zmkh-roadhome.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /uploads/ {
        alias /var/www/road-home/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
